# Copy this file to .github/workflows/backup.yml in the chess-club-backups repo.
# Needs two repository secrets: SUPABASE_DB_URL (the connection string) and BACKUP_TOKEN
# (a fine-grained token with contents:write on this repo).

name: Weekly database backup

on:
  schedule:
    - cron: "30 21 * * 0"   # Monday 03:00 IST
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dump the database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          mkdir -p backups
          FILE="backups/$(date +%Y-%m-%d).sql.gz"
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" --no-owner --no-privileges | gzip > "$FILE"
          ls -lh "$FILE"

      - name: Keep the last twelve
        run: |
          cd backups
          ls -1t *.sql.gz | tail -n +13 | xargs -r rm --

      - name: Commit
        run: |
          git config user.name "backup-bot"
          git config user.email "backup@users.noreply.github.com"
          git add -A
          git commit -m "Backup $(date +%Y-%m-%d)" || echo "nothing to commit"
          git push
